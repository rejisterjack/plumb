name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go build -ldflags "-s -w -X github.com/rejisterjack/plumb/internal/cli.version=ci" -o plumb .
      - run: ./plumb version
